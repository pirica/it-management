name: Smoke tests

on:
  push:
    branches:
      - master
      - main
  pull_request:

# Why: GitHub is deprecating Node.js 20 for JavaScript actions (checkout, setup-php, etc.).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mysqli
          coverage: none

      - name: Run smoke test runner
        run: bash scripts/smoke_test.sh

  database-import:
    runs-on: ubuntu-latest
    # Why: GHA MySQL service listens on 3306; import_database_split.sh defaults to 3307 (Dunebox).
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_PASSWORD: itmanagement
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: itmanagement
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pitmanagement"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mysqli
          coverage: none

      # CI uses monolith db/; local dev may use bash scripts/import_database_split.sh (db/01→02→03).
      - name: Import db/ split bundle
        run: bash scripts/verify_database_sql_import.sh

      - name: Verify FK label search regression
        run: php scripts/verify_crud_fk_label_search.php

  tier2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mysqli
          coverage: none

      - name: Run Tier 2 static checks
        run: php scripts/run_tier2_checks.php

  phpunit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mysqli, dom, json, libxml, mbstring, tokenizer, xml, xmlwriter
          coverage: none

      - name: Run PHPUnit (skip DB tests)
        run: ITM_SKIP_DB_TESTS=1 php scripts/run_tests.php
